# Foundry config. Keeps Centrifuge Tinlake's tiered fuzz-profile convention, but
# on modern solc 0.8.x with permissive (MIT) dependencies only — suitable for a
# public reference implementation. Deps: forge-std + OpenZeppelin (both MIT).
# Auth and RAY math are vendored in-repo under MIT (src/auth, src/math).

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
verbosity = 3
fs_permissions = [{ access = "read", path = "./out" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 100

# Pull-request profile: heavier fuzzing.
[profile.pr.fuzz]
runs = 1000

# CI / push-to-main profile: exhaustive fuzzing.
[profile.ci.fuzz]
runs = 50000
max_test_rejects = 262144

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
